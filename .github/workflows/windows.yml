# Builds the Windows installer only when asked (Actions tab, or
# `gh workflow run windows.yml`), and first runs the whole local-transcription
# chain on a real Windows machine: download parts, pull audio out of a video,
# whisper. The installer is attached to the run as the "LinguaClip-windows" artifact.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Extra tauri --config JSON, for update tests (docs/update.md), e.g. {"version":"0.2.1"}'
        required: false
        default: '{}'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Download parts and transcribe a clip (network)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored fetch_vad fetch_whisper transcribes_speech downloads_ffmpeg
      # No AI keys exist in CI, so nothing of the author's can end up in the build.
      # With the updater key secret (official builds) it also makes the signed update package, docs/update.md.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          EXTRA: ${{ inputs.config || '{}' }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}' --config "$EXTRA"
          else
            npx tauri build --bundles nsis --config "$EXTRA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LinguaClip-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
