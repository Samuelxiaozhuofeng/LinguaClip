# Builds the Intel Mac app only when asked (`gh workflow run mac-intel.yml`).
# Runs the whole local-transcription chain on a real Intel Mac first (download
# the x86_64 whisper-cli, pull audio out of a video, whisper), then zips the app
# as the "LinguaClip-mac-intel" artifact. The Apple-silicon build is made locally.
name: Mac Intel build

on:
  workflow_dispatch:

jobs:
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Download parts and transcribe a clip (network)
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored fetch_whisper transcribes_speech
      # No AI keys exist in CI, so nothing of the author's can end up in the build.
      # With the updater key secret (official builds) it also makes the signed update package, docs/update.md.
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --bundles app
          fi
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/LinguaClip.app LinguaClip-mac-intel.zip
      - name: Update package
        shell: bash
        run: |
          B=src-tauri/target/release/bundle/macos
          if [ -f $B/LinguaClip.app.tar.gz.sig ]; then
            cp $B/LinguaClip.app.tar.gz LinguaClip-mac-intel.app.tar.gz
            cp $B/LinguaClip.app.tar.gz.sig LinguaClip-mac-intel.app.tar.gz.sig
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: LinguaClip-mac-intel
          path: LinguaClip-mac-intel*
