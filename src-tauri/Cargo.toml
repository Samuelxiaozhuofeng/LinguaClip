[package]
name = "linguaclip"
version = "0.2.0"
description = "LinguaClip video dictation"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "linguaclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-http = { version = "=2.6.1", features = ["unsafe-headers"] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2.5.5"
reqwest-websocket = "0.5"
# Same 0.12 the http plugin already pulls in; used for AnkiConnect (anki.rs)
reqwest = { version = "0.12", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["time"] }
# Reads a video's audio track where macOS's afconvert is not around (decode.rs)
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "pcm", "alac", "flac", "isomp4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
